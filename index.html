<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musikquiz-Trainer</title>
  <meta name="description" content="Trainiere für dein nächstes Musikquiz: Songs erkennen, Wissensfragen, Jahre schätzen.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Musikquiz">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> Musikquiz-Trainer</div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><span>🎯</span>Training</button>
    <button data-tab="songs"><span>🎵</span>Songs</button>
    <button data-tab="stats"><span>📊</span>Statistik</button>
    <button data-tab="settings"><span>⚙️</span>Optionen</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
